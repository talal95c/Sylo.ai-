id: FR-GH
version: 2026-10-10
profiles: [FR, GH]
settlementModes: [ONCHAIN_ESCROW, FIAT_HOLD]
rails: [R1, R2, R3, R4]
treaty: FR-GH-DTC-1993
flags:
  allowVaspPathForExportProceeds: true
rules:
  - id: GH_FX_EXPORT_PROCEEDS_NOMINATED_BANK
    applies_to:
      routes: [R1, R2, R3, R4]
      purpose: [GOODS]
    condition: route credits the nominated export-proceeds bank and documents.locRef is present.
    result: PASS
    legalRef: Foreign Exchange Act 2006 (Act 723); BoG Notice BG/GOV/SEC/2025/34
    source: https://www.bog.gov.gh/wp-content/uploads/2025/10/NOTICE-NO.-BG-GOV-SEC-2025-34-NOTICE-Notice-on-Extension-Period-for-Letter-of-Commitment-LOC.pdf
  - id: GH_VASP_LICENSED
    applies_to:
      routes: [R3]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: route uses a Ghana-licensed VASP.
    result: PASS
    legalRef: Virtual Asset Service Providers Act 2025 (Act 1154)
    source: https://www.bog.gov.gh/virtual-assets/
  - id: GH_WALLET_DAILY_CAP
    applies_to:
      routes: [R4]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: Enhanced-KYC mobile wallet exposure is within GHS 25,000 per day.
    result: PASS
    legalRef: Bank of Ghana mobile money wallet limits
    source: https://www.ghanaweb.com/GhanaHomePage/business/MoMo-Transactions-BoG-revises-customer-wallet-caps-effective-March-1-1919006
  - id: EU_MICA_EMT_CASP
    applies_to:
      routes: [R3]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: Stablecoin legs use an authorised EMT issuer and CASP.
    result: PASS
    legalRef: Regulation (EU) 2023/1114 (MiCA)
    source: https://www.circle.com/fr/legal/licenses
  - id: EU_TRAVEL_RULE
    applies_to:
      routes: [R3]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: Originator and beneficiary data accompany crypto transfers.
    result: PASS
    legalRef: Regulation (EU) 2023/1113
    source: https://eur-lex.europa.eu/eli/reg/2023/1113/oj
  - id: EU_HIGH_RISK_EDD
    applies_to:
      routes: [R1, R2, R3, R4]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: Enhanced due diligence applies to listed high-risk third countries.
    result: PASS
    legalRef: EU list of high-risk third countries
    source: https://finance.ec.europa.eu/financial-crime/anti-money-laundering-and-countering-financing-terrorism-international-level_en
  - id: EU_VOP_SCOPE
    applies_to:
      routes: [R2]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: Outside-SEPA beneficiaries require an out-of-band payee check.
    result: PASS
    legalRef: EU Instant Payments Regulation and EPC Verification of Payee scheme
    source: https://www.ecb.europa.eu/paym/retail/instant_payments/html/instant_payments_regulation.en.html
  - id: SANCTIONS_SCREEN
    applies_to:
      routes: [R1, R2, R3, R4]
      purpose: [GOODS, SERVICES_TECHNICAL, SERVICES_OTHER]
    condition: Synthetic PoC sanctions list must not return a hit.
    result: PASS
    legalRef: Synthetic sanctions screen (PoC)
    source: https://finance.ec.europa.eu/financial-crime/anti-money-laundering-and-countering-financing-terrorism-international-level_en
