services:
  - type: web
    name: sylo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /health
    buildFilter:
      paths:
        - engine/**
        - ml/**
        - spec/**
        - chain/**
        - web/**
        - contracts/deployments/**
        - Dockerfile
        - scripts/start-render.sh
        - render.yaml
    envVars:
      - key: RISK_MODE
        value: model
      - key: LLM_MODE
        value: cached
      - key: JEV_MODE
        value: cached
      - key: JEV_BASE_URL
        value: https://api.codiv.ai
      - key: JEV_MODEL
        value: openjev-latest
      - key: JEV_API_KEY
        sync: false
      - key: LIVE_INVOICE
        value: "on"
      - key: CHAIN_MODE
        value: mock
      - key: DEMO_PUBLIC
        value: "1"
      - key: MISTRAL_API_KEY
        sync: false
