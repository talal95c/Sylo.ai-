services:
  - type: web
    name: sylo-engine
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /health
    buildFilter:
      paths:
        - engine/**
        - ml/**
        - spec/**
        - chain/**
        - render.yaml
    envVars:
      - key: RISK_MODE
        value: model
      - key: LLM_MODE
        value: cached
      - key: JEV_MODE
        value: cached
      - key: CHAIN_MODE
        value: mock
      - key: CORS_ORIGINS
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
