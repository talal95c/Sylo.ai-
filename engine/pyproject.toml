[project]
name = "sylo-engine"
version = "0.1.0"
description = "Sylo.ai engine: norms, risk, routing, signed intents, chain port, orchestration and event stream"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "eth-account>=0.13",
  "sylo-spec",
]

[project.optional-dependencies]
model = ["sylo-risk"]
fuji = ["sylo-chain"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "jsonschema>=4.21"]

[tool.uv.sources]
sylo-spec = { path = "../spec/python", editable = true }
sylo-risk = { path = "../ml", editable = true }
sylo-chain = { path = "../chain", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sylo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
