[project]
name = "sylo-spec"
version = "0.1.0"
description = "Sylo.ai shared spec: models, ports, EIP-712 helpers, canonical scenarios and conformance suites"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "eth-account>=0.13",
  "eth-hash[pycryptodome]>=0.7",
  "eth-utils>=4",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sylo_spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
