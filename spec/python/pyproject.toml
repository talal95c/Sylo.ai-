[project]
name = "sylo-spec"
version = "0.1.0"
description = "Sylo.ai shared interfaces: models, ports, EIP-712, scenarios and conformance suites"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "eth-account>=0.13",
    "jsonschema>=4.21",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sylo_spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
