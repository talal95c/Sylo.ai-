[project]
name = "sylo-risk"
version = "0.1.0"
description = "Sylo.ai Lane B: calibrated fraud model implementing RiskPort (skeleton in v0)"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "sylo-spec",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
sylo-spec = { path = "../spec/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sylo_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
