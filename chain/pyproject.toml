[project]
name = "sylo-chain"
version = "0.1.0"
description = "Sylo.ai Lane C: Avalanche Fuji client implementing ChainPort (skeleton in v0)"
requires-python = ">=3.11"
dependencies = [
  "web3>=7",
  "sylo-spec",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
sylo-spec = { path = "../spec/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sylo_chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
