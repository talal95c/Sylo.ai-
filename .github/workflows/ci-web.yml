name: ci-web

on:
  pull_request:
    paths: ["web/**", "spec/**", ".github/workflows/ci-web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "spec/**", ".github/workflows/ci-web.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version is the one pinned in web/package.json ("packageManager"). It must run on
      # Node 20 (pnpm 11 and later need Node 22.13 or later).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web typecheck
      - name: Reducer tests (replay every recorded fixture)
        run: pnpm -C web test
      - run: pnpm -C web build
