name: ci-spec

on:
  pull_request:
    paths: ["spec/**", ".github/workflows/ci-spec.yml"]
  push:
    branches: [main]
    paths: ["spec/**", ".github/workflows/ci-spec.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: spec/python/uv.lock
      - run: uv sync --locked
      - name: Tests (models, EIP-712 vector, conformance suites)
        run: uv run pytest -q
      - name: Validate fixtures and geography against the schemas
        run: uv run python ../scripts/validate.py
