name: ci-spec

on:
  pull_request:
    paths: ["spec/**", ".github/workflows/ci-spec.yml"]
  push:
    branches: [main]
    paths: ["spec/**", ".github/workflows/ci-spec.yml"]

jobs:
  spec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Package tests (EIP-712 vector, schema, scenarios, fixtures)
        run: uv run pytest
      - name: Fixtures are schema-valid
        run: uv run python ../scripts/validate.py
      - name: eip712.json is generated by the code
        run: uv run python -m sylo_spec.eip712 --check
